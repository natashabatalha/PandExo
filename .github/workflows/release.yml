name: Release Validation

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest tests -q -rs

  package:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: >-
          python -c 'import os, tomllib;
          from packaging.version import Version;
          package_version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"];
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v");
          assert Version(tag_version) == Version(package_version),
          f"tag {tag_version!r} does not match package version {package_version!r}"'

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pandexo-engine-distributions
          path: dist/

  publish:
    name: Publish distribution to PyPI
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: pypi
      url: https://pypi.org/p/pandexo.engine
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v5
        with:
          name: pandexo-engine-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
